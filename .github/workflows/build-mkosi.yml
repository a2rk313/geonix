---
name: Build mkosi images

on:
  push:
    branches:
      - mkosi-experiment
  workflow_dispatch:

env:
  IMAGE_NAME: geonix
  DEFAULT_TAG: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.variant }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - gnome
          - plasma

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            mkosi \
            ostree \
            systemd-container \
            dosfstools \
            mtools \
            parted \
            qemu-utils \
            systemd-ukify \
            python3-pefile \
            python3-virt-firmware \
            podman \
            skopeo

      - name: Build OS tree
        run: |
          if [ "${{ matrix.variant }}" = "plasma" ]; then
            sudo mkosi build --format=directory --include mkosi.conf.d/02-plasma.conf
          else
            sudo mkosi build --format=directory
          fi

      - name: Fix output permissions
        run: sudo chown -R $USER:$USER output/

      - name: Commit to ostree
        run: |
          sudo mkdir -p /tmp/ostree-repo
          sudo ostree --repo=/tmp/ostree-repo init --mode=archive-z2
          sudo ostree --repo=/tmp/ostree-repo commit \
            --branch=geonix/26.04/${{ matrix.variant }} \
            --tree=dir=output/ \
            --add-metadata-string=version=$(date +%Y%m%d)

      - name: Build ISO
        run: |
          sudo mkosi clean
          if [ "${{ matrix.variant }}" = "plasma" ]; then
            sudo mkosi build --format=iso --bootable=yes --include mkosi.conf.d/02-plasma.conf
          else
            sudo mkosi build --format=iso --bootable=yes
          fi

      - name: Fix output permissions after ISO
        run: sudo chown -R $USER:$USER output/

      - name: Build QCOW2
        run: |
          sudo mkosi clean
          if [ "${{ matrix.variant }}" = "plasma" ]; then
            sudo mkosi build --format=disk --bootable=yes --include mkosi.conf.d/02-plasma.conf
          else
            sudo mkosi build --format=disk --bootable=yes
          fi
          sudo qemu-img convert -f raw -O qcow2 \
            output/*.raw \
            output/geonix-${{ matrix.variant }}.qcow2

      - name: Fix output permissions after QCOW2
        run: sudo chown -R $USER:$USER output/

      - name: Upload ostree repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ matrix.variant }}-ostree
          path: /tmp/ostree-repo/
          retention-days: 7

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ matrix.variant }}-iso
          path: output/*.iso
          retention-days: 7

      - name: Upload QCOW2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ matrix.variant }}-qcow2
          path: output/*.qcow2
          retention-days: 7

      - name: Push ostree to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin
          sudo ostree container encapsulate \
            --repo=/tmp/ostree-repo \
            geonix/26.04/${{ matrix.variant }} \
            docker://ghcr.io/${{ github.repository_owner }}/geonix:${{ matrix.variant }}
