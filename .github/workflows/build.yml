---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "05 10 * * *" # daily upstream check — skips build if nothing changed
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

env:
  IMAGE_DESC: "A Universal Blue based distro made for the cool folks that use GIS and Remote Sensing knowledge to make the world a better place."
  IMAGE_KEYWORDS: "bootc,ublue,gis,qgis,geospatial,remote-sensing"
  IMAGE_LOGO_URL: "https://raw.githubusercontent.com/a2rk313/geonix/main/geonix-logo-128.png"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check_upstream:
    name: Check for upstream changes
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Restore digest cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: upstream-digests-${{ runner.os }}

      - name: Check upstream image digests
        id: check
        run: |
          # Non-schedule triggers always build
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Non-schedule trigger — building unconditionally."
            exit 0
          fi

          AURORA=$(skopeo inspect docker://ghcr.io/ublue-os/aurora:latest \
            | jq -r '.Digest')
          BLUEFIN=$(skopeo inspect docker://ghcr.io/ublue-os/bluefin:latest \
            | jq -r '.Digest')

          STORED_AURORA=$(cat .cache/aurora-digest 2>/dev/null || echo "none")
          STORED_BLUEFIN=$(cat .cache/bluefin-digest 2>/dev/null || echo "none")

          echo "Aurora:  current=${AURORA}  stored=${STORED_AURORA}"
          echo "Bluefin: current=${BLUEFIN}  stored=${STORED_BLUEFIN}"

          if [[ "$AURORA" == "$STORED_AURORA" && "$BLUEFIN" == "$STORED_BLUEFIN" ]]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No upstream changes — skipping build."
          else
            mkdir -p .cache
            echo "$AURORA"  > .cache/aurora-digest
            echo "$BLUEFIN" > .cache/bluefin-digest
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Upstream changed — triggering build."
          fi

      - name: Save digest cache
        uses: actions/cache/save@v4
        if: steps.check.outputs.changed == 'true'
        with:
          path: .cache
          key: upstream-digests-${{ runner.os }}

  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04
    needs: check_upstream
    if: needs.check_upstream.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: aurora
            base_image: ghcr.io/ublue-os/aurora:latest
            image_name: geonix-plasma
          - base: bluefin
            base_image: ghcr.io/ublue-os/bluefin:latest
            image_name: geonix-gnome

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ matrix.image_name }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BASE_VARIANT=${{ matrix.base }}
            IMAGE_NAME=${{ matrix.image_name }}
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            DEFAULT_TAG=${{ env.DEFAULT_TAG }}
          oci: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push staging image
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.DEFAULT_TAG }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Chunk image for efficient updates
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          # Login rootful podman to GHCR so it can pull the latest image
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u ${{ github.actor }} --password-stdin
          sudo podman pull ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          sudo rpm-ostree compose build-chunked-oci \
            --bootc \
            --format-version=2 \
            --from=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --output containers-storage:${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          for tag in ${{ steps.metadata.outputs.tags }}; do
            sudo podman push \
              ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              docker://${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}
          done

      # Pull requests skip chunking — standard push for PR validation only
      - name: Login to GitHub Container Registry (PR)
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        if: github.event_name == 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR (PR only)
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
        if: github.event_name == 'pull_request'
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
