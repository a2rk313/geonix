---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "05 10 * * *" # daily upstream check — skips build if nothing changed
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

env:
  IMAGE_DESC: "A Fedora Atomic based distro using uBlue components made for the cool folks that use GIS and Remote Sensing knowledge to make the world a better place."
  IMAGE_KEYWORDS: "bootc,fedora-atomic,gis,qgis,geospatial,remote-sensing"
  IMAGE_LOGO_URL: "https://raw.githubusercontent.com/a2rk313/geonix/main/logo/logo_small_128.png"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install tooling
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | sudo bash -s -- --to /usr/local/bin
      - name: just check
        run: just check
      - name: shellcheck
        run: just lint

  check_upstream:
    name: Check for upstream changes
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      base_version: ${{ steps.check.outputs.base_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Restore digest cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: upstream-digests-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            upstream-digests-${{ runner.os }}-

      - name: Discover base version + check upstream digests
        id: check
        run: |
          set -euo pipefail
          API="https://quay.io/api/v1/repository/fedora-ostree-desktops"

          curl -fsSL "$API/silverblue/tag/?onlyActiveTags=true&limit=100" -o /tmp/tags-sb.json
          curl -fsSL "$API/kinoite/tag/?onlyActiveTags=true&limit=100" -o /tmp/tags-kt.json
          # Exact-version membership = GA status (branched releases appear only as "N Beta").
          curl -fsSL "https://getfedora.org/releases.json" -o /tmp/fedora-releases.json

          # Rawhide is aliased as the highest integer tag on both repos — exclude it by digest.
          RAWHIDE=$(jq -r '[.tags[] | select(.name == "rawhide") | .manifest_digest][0] // empty' /tmp/tags-sb.json)
          [[ -n "$RAWHIDE" ]] || { echo "::error::rawhide tag missing from quay tag list"; exit 1; }

          CANDIDATES=$(jq -r --arg rw "$RAWHIDE" '
            [.tags[] | select(.is_manifest_list and (.name | test("^[0-9]+$")) and .manifest_digest != $rw)
             | .name] | sort_by(tonumber) | reverse | .[]' /tmp/tags-sb.json)
          [[ -n "$CANDIDATES" ]] || { echo "::error::no numeric base tags on quay"; exit 1; }

          BASE_VERSION=""
          while read -r v; do
            if jq -e --arg v "$v" '[.[] | select(.version == $v)] | length > 0' /tmp/fedora-releases.json >/dev/null; then
              BASE_VERSION="$v"
              echo "Fedora $v is GA — selecting."
              break
            fi
            echo "Fedora $v is not GA yet (Branched/Beta) — stepping down."
          done <<< "$CANDIDATES"
          [[ -n "$BASE_VERSION" ]] || { echo "::error::no GA-eligible Fedora base"; exit 1; }
          echo "Tracking fedora-ostree-desktops base ${BASE_VERSION}"

          SILVERBLUE=$(jq -r --arg v "$BASE_VERSION" \
            '[.tags[] | select(.name == $v and .is_manifest_list) | .manifest_digest][0] // empty' /tmp/tags-sb.json)
          KINOITE=$(jq -r --arg v "$BASE_VERSION" \
            '[.tags[] | select(.name == $v and .is_manifest_list) | .manifest_digest][0] // empty' /tmp/tags-kt.json)
          [[ -n "$SILVERBLUE" && -n "$KINOITE" ]] || { echo "::error::tag ${BASE_VERSION} missing on one repo"; exit 1; }

          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT

          # Non-schedule triggers always build
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Non-schedule trigger — building on ${BASE_VERSION} unconditionally."
            exit 0
          fi

          STORED_VERSION=$(cat .cache/base-version 2>/dev/null || echo "none")
          STORED_KINOITE=$(cat .cache/kinoite-digest 2>/dev/null || echo "none")
          STORED_SILVERBLUE=$(cat .cache/silverblue-digest 2>/dev/null || echo "none")

          echo "Base version: current=${BASE_VERSION} stored=${STORED_VERSION}"
          echo "Kinoite:      current=${KINOITE} stored=${STORED_KINOITE}"
          echo "Silverblue:   current=${SILVERBLUE} stored=${STORED_SILVERBLUE}"

          if [[ "$BASE_VERSION" == "$STORED_VERSION" && "$KINOITE" == "$STORED_KINOITE" && "$SILVERBLUE" == "$STORED_SILVERBLUE" ]]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No upstream changes — skipping build."
          else
            mkdir -p .cache
            echo "$BASE_VERSION" > .cache/base-version
            echo "$KINOITE"     > .cache/kinoite-digest
            echo "$SILVERBLUE"  > .cache/silverblue-digest
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Upstream changed — triggering build."
          fi

      - name: Save digest cache
        uses: actions/cache/save@v6
        if: steps.check.outputs.changed == 'true'
        with:
          path: .cache
          key: upstream-digests-${{ runner.os }}-${{ github.run_id }}

  build_push:
    name: Build and push image
    runs-on: ${{ matrix.runner }}
    needs: check_upstream
    if: needs.check_upstream.outputs.changed == 'true' && needs.check_upstream.outputs.base_version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: silverblue
            base_image: quay.io/fedora-ostree-desktops/silverblue:${{ needs.check_upstream.outputs.base_version }}
            image_name: geonix-gnome
            platform: amd64
            runner: ubuntu-24.04
          - base: silverblue
            base_image: quay.io/fedora-ostree-desktops/silverblue:${{ needs.check_upstream.outputs.base_version }}
            image_name: geonix-gnome
            platform: arm64
            runner: ubuntu-24.04-arm
          - base: kinoite
            base_image: quay.io/fedora-ostree-desktops/kinoite:${{ needs.check_upstream.outputs.base_version }}
            image_name: geonix-plasma
            platform: amd64
            runner: ubuntu-24.04
          - base: kinoite
            base_image: quay.io/fedora-ostree-desktops/kinoite:${{ needs.check_upstream.outputs.base_version }}
            image_name: geonix-plasma
            platform: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ matrix.platform }},enable=${{ github.event_name == 'pull_request' }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v2
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ matrix.image_name }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BASE_VARIANT=${{ matrix.base }}
            IMAGE_NAME=${{ matrix.image_name }}
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            DEFAULT_TAG=${{ env.DEFAULT_TAG }}
          oci: false
          platforms: linux/${{ matrix.platform }}
          extra-args: --timestamp 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Chunk image for efficient updates
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: chunk
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u ${{ github.actor }} --password-stdin

          # Transfer locally built image from user storage to rootful storage
          # buildah-build stores in user (~/.local/share/containers/storage),
          # chunking needs it in /var/lib/containers/storage
          podman save "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" | sudo podman load

          sudo podman tag "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"

          CHUNKED_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-chunked"

          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            registry.fedoraproject.org/fedora-bootc:latest \
            rpm-ostree compose build-chunked-oci \
              --bootc \
              --format-version=2 \
              --from="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" \
              --output "containers-storage:${CHUNKED_REF}"

          DATE=$(date -u +%Y%m%d)
          DIGEST=""
          PLATFORM=${{ matrix.platform }}
          for tag in "${DEFAULT_TAG}-chunked-${PLATFORM}"; do
            sudo skopeo copy \
              --dest-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              --dest-compress-format=zstd:chunked \
              --digestfile="/tmp/digest.txt" \
              "containers-storage:${CHUNKED_REF}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            DIGEST=$(sudo cat /tmp/digest.txt)
            sudo rm -f /tmp/digest.txt
          done
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "Pushed chunked ${PLATFORM}: ${DIGEST}"

      # Pull requests skip chunking — standard push for PR validation only
      - name: Login to GitHub Container Registry (PR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR (PR only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          for tag in ${{ steps.metadata.outputs.tags }}; do
            sudo skopeo copy \
              --dest-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              --dest-compress-format=zstd \
              "containers-storage:${IMAGE_NAME}:${tag}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

  merge_push:
    name: Merge manifests + sign
    runs-on: ubuntu-24.04
    needs: build_push
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: geonix-gnome
          - image_name: geonix-plasma
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> ${GITHUB_ENV}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge per-arch chunked refs into public tags
        id: merge
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)
          for TAG in "${DEFAULT_TAG}" "${DEFAULT_TAG}.${DATE}" "${DATE}"; do
            sudo podman manifest create --amend \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}:${TAG}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-chunked-amd64" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-chunked-arm64"
            sudo podman manifest push --all "${IMAGE_REGISTRY}/${IMAGE_NAME}:${TAG}"
          done
          sudo skopeo inspect docker://"${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" \
            | jq -r '.Digest' > /tmp/digest.txt
          echo "digest=$(cat /tmp/digest.txt)" >> $GITHUB_OUTPUT
      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: "v2.6.1"
      - name: Sign container image
        run: |
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          cosign sign -y --key env://SIGNING_SECRET "${IMAGE_FULL}@${{ steps.merge.outputs.digest }}"
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
