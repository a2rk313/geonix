[Build]
ToolsTree=default

[Distribution]
Distribution=ubuntu
Release=resolute

[Repositories]
Suite=resolute
Components=main,restricted,universe

[Output]
Format=directory
OutputDirectory=output

[Content]
Bootable=yes
Autologin=yes
Hostname=geonix

Packages=
    # Desktop environment (GNOME default)
    ubuntu-desktop

    # Desktop GIS
    qgis
    qgis-plugin-grass
    qgis-server
    grass
    saga

    # Geospatial libraries
    gdal-bin
    libgdal-dev
    libgeos-dev
    proj-bin
    libproj-dev
    libgeotiff-dev
    libspatialindex-dev
    libspatialite-dev

    # Python GIS stack
    python3-shapely
    python3-fiona
    python3-rasterio
    python3-geopandas
    python3-pyproj
    python3-numpy
    python3-pandas
    python3-matplotlib
    python3-scipy
    python3-netcdf4
    python3-h5py
    python3-scikit-learn

    # Databases
    postgresql
    postgresql-16-postgis-3

    # System tools
    curl
    wget
    git
    htop
    neovim
